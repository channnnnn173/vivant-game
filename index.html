<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暗号パネル</title>
<style>
:root{--bg:#0d0e0f;--wall:#2a2b2b;--wall2:#1c1d1d;--ink:#cfcac0;--red:#ff3b2f;--dim:#8a867d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;overscroll-behavior:none;user-select:none}
body{display:flex;justify-content:center}
@supports (height:100dvh){html{height:100dvh}}
#app{width:100%;max-width:480px;height:100%;min-height:640px;display:flex;flex-direction:column;padding:12px 16px 16px}
header{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--dim)}
header b{color:var(--ink);font-size:16px}
#life{color:var(--red);letter-spacing:.2em}
#msg{min-height:44px;margin:8px 0 6px;font-size:15px;line-height:1.5}
#bar{height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin-bottom:10px}
#fill{height:100%;width:100%;background:var(--red);transform-origin:left}
#scene{position:relative;flex:1;min-height:440px;border-radius:6px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#3a3b3a 0%,var(--wall) 45%,var(--wall2) 100%);box-shadow:inset 0 0 60px #000;display:flex;align-items:center;justify-content:center;padding:20px}
#grid{position:absolute;inset:16px}
.pad{position:absolute;width:var(--s);height:var(--s);border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#3b3a39,#161616);box-shadow:inset 0 0 0 3px #0b0b0b,0 0 0 3px #3d3d3c,0 6px 14px #000;cursor:pointer;transition:box-shadow .08s,background .08s}
.pad::after{content:"";position:absolute;left:50%;top:50%;width:14%;height:14%;margin:-7%;border-radius:50%;background:#4a1612}
.pad.lit{background:radial-gradient(circle at 40% 35%,#ff7a6e,#c4271c);box-shadow:inset 0 0 0 3px #3a0a07,0 0 0 3px #6b2a25,0 0 34px 8px #ff3b2f99}
.pad.lit::after{background:#fff6}
.pad.ng{background:radial-gradient(circle at 40% 35%,#777,#333)}
.pad:disabled{cursor:default}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000d;text-align:center;padding:24px}
#ov.off{display:none}
#ov h1{margin:0;font-size:28px;letter-spacing:.08em}
#ov p{margin:0;color:var(--dim);font-size:14px;line-height:1.7}
.main{padding:12px 30px;font-size:16px;border:1px solid var(--red);background:transparent;color:var(--ink);border-radius:4px;cursor:pointer}
#snd{background:none;border:0;color:var(--dim);font-size:13px;cursor:pointer;padding:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* 全体コンテナ */
.door-container {
  position: relative;
  width: 100%;
  height: 300px; /* 必要に応じて高さ調整 */
  background-color: #0d0d0d;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  border: 2px solid #333;
}

/* 扉の奥の文字デザイン */
.behind-door {
  position: absolute;
  z-index: 1;
  text-align: center;
}

.welcome-text {
  color: #e50914; /* 雰囲気のある赤色（金色なら #d4af37 など） */
  font-size: 2rem;
  font-weight: bold;
  letter-spacing: 6px;
  opacity: 0;
  transform: scale(0.8);
  /* 扉が開く（1.5秒）のを待ってから1秒かけてフェードイン表示 */
  transition: opacity 1s ease 1.2s, transform 1s ease 1.2s;
}

/* 扉が開いた時の文字表示効果 */
.door-container.open .welcome-text {
  opacity: 1;
  transform: scale(1);
}

/* 左右の扉のデザイン */
.door {
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
  border: 1px solid #444;
  z-index: 2;
  /* スムーズに開くアニメーション設定 */
  transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1);
}

.door-left {
  left: 0;
}

.door-right {
  right: 0;
}

/* 扉が開く時の動作（左右にスライド） */
.door-container.open .door-left {
  transform: translateX(-100%);
}

.door-container.open .door-right {
  transform: translateX(100%);
}

/* テスト用ボタン */
.open-btn {
  margin-top: 15px;
  padding: 10px 20px;
  background-color: #333;
  color: #fff;
  border: none;
  cursor: pointer;
  border-radius: 4px;
}
.open-btn:hover {
  background-color: #555;
}
</style>
</head>
<body>
<div id="app">
  <header><b id="st">ステージ 1/6</b><span id="life" aria-label="ライフ">●●●</span><button id="snd">音 ON</button></header>
  <div id="msg">&nbs
    p;</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="scene">
    <div id="grid"></div>
    <div id="ov"><h1 id="ot">暗号パネル</h1><p id="op">壁のボタンが光る順番を覚えて、同じ順にタッチ。<br>制限時間内に6ステージを突破しよう。</p><button class="main" id="go">スタート</button></div>
  </div>
  <!-- 扉とメッセージのコンテナ -->
<div class="door-container" id="doorContainer">
  <!-- 扉の奥にあるメッセージ（初期状態は隠れている） -->
  <div class="behind-door">
    <h1 class="welcome-text">ようこそ別班へ</h1>
  </div>

  <!-- 左右の扉 -->
  <div class="door door-left"></div>
  <div class="door door-right"></div>
</div>

<!-- アニメーションを動かすテスト用ボタン（演出テスト用） -->
<button class="open-btn" onclick="openDoor()">扉を開く</button>
</div>
<script>
(function(){
  var CFG=[{n:4,len:3,show:700},{n:4,len:4,show:620},{n:6,len:4,show:560},{n:6,len:5,show:500},{n:9,len:5,show:450},{n:9,len:6,show:400}];
  var FREQ=[262,294,330,392,440,523,587,659,784];
  var $=function(i){return document.getElementById(i)};
  var grid=$("grid"),msg=$("msg"),fill=$("fill"),ov=$("ov");
  var stage,lives,seq,pos,phase,token=0,raf=0,pads=[],ac=null,muted=false,limit,t0;

  function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume()}
  function tone(f,d,type,vol,when){
    if(muted||!ac)return;
    var t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
  }
  var sfx={
    ok:function(){[523,659,784].forEach(function(f,i){tone(f,.18,"triangle",.2,i*.09)})},
    ng:function(){tone(150,.4,"sawtooth",.18);tone(110,.4,"square",.1,.05)},
    tick:function(){tone(1000,.05,"square",.06)},
    win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.3,"triangle",.2,i*.12)})},
    lose:function(){[330,262,196,131].forEach(function(f,i){tone(f,.35,"sawtooth",.15,i*.2)})}
  };

  function say(t){msg.textContent=t}
  function hearts(){var s="";for(var i=0;i<3;i++)s+=i<lives?"●":"○";$("life").textContent=s}
  function wait(ms,tk){return new Promise(function(r){setTimeout(function(){r(tk===token)},ms)})}

  function build(n){
    grid.innerHTML="";pads=[];
    var W=grid.clientWidth||300,H=grid.clientHeight||400,S=Math.min(n===9?58:n===6?66:74,Math.floor(Math.sqrt(W*H/(n*2.8)))),P=[],tries=0,f=1.4;
    while(P.length<n&&tries<4000){tries++;if(tries%1000===0)f-=.1;var x=Math.random()*(W-S),y=Math.random()*(H-S),ok=true;for(var j=0;j<P.length;j++){if(Math.hypot(P[j][0]-x,P[j][1]-y)<S*f){ok=false;break}}if(ok)P.push([x,y])}
    while(P.length<n)P.push([Math.random()*(W-S),Math.random()*(H-S)]);
    grid.style.setProperty("--s",S+"px");
    for(var i=0;i<n;i++){(function(i){
      var b=document.createElement("button");b.className="pad";b.setAttribute("aria-label","ボタン"+(i+1));b.disabled=true;
      b.addEventListener("pointerdown",function(e){e.preventDefault();press(i)});
      b.style.left="calc((100% - var(--s)) * "+(P[i][0]/(W-S)).toFixed(4)+")";b.style.top="calc((100% - var(--s)) * "+(P[i][1]/(H-S)).toFixed(4)+")";
      grid.appendChild(b);pads.push(b);
    })(i)}
  }
  function flash(i,ms,cls){var p=pads[i];p.classList.add(cls||"lit");setTimeout(function(){p.classList.remove(cls||"lit")},ms)}
  function enable(on){pads.forEach(function(p){p.disabled=!on})}

  async function runStage(){
    var tk=++token,c=CFG[stage];
    cancelAnimationFrame(raf);fill.style.transform="scaleX(1)";
    $("st").textContent="ステージ "+(stage+1)+"/"+CFG.length;hearts();
    build(c.n);enable(false);phase="show";
    seq=[];for(var i=0;i<c.len;i++){seq.push(Math.floor(Math.random()*c.n))}
    say("お手本をよく見て…");
    if(!await wait(900,tk))return;
    for(var k=0;k<seq.length;k++){
      flash(seq[k],c.show-80);tone(FREQ[seq[k]],c.show/1000,"sine",.22);
      if(!await wait(c.show+220,tk))return;
    }
    phase="input";pos=0;enable(true);say("同じ順にタッチ！");
    limit=(c.len*1.4+2.5-stage*.2)*1000;t0=performance.now();lastTick=-1;
    loop(tk);
  }
  var lastTick=-1;
  function loop(tk){
    if(tk!==token||phase!=="input")return;
    var left=limit-(performance.now()-t0);
    fill.style.transform="scaleX("+Math.max(0,left/limit)+")";
    var s=Math.ceil(left/1000);
    if(s<=3&&s>0&&s!==lastTick){lastTick=s;sfx.tick()}
    if(left<=0){fail("時間切れ！");return}
    raf=requestAnimationFrame(function(){loop(tk)});
  }
  function press(i){
    if(phase!=="input")return;
    audio();
    if(i===seq[pos]){
      flash(i,160);tone(FREQ[i],.25,"sine",.25);pos++;
      if(pos===seq.length)success();
    }else{flash(i,300,"ng");fail("Fail 失敗")}
  }
  async function success(){
    phase="done";enable(false);cancelAnimationFrame(raf);var tk=token;
    await wait(250,tk);sfx.ok();openDoor();say("成功！");
    stage++;
    if(stage>=CFG.length){await wait(900,tk);return end(true)}
    if(await wait(1200,tk))runStage();
  }
  async function fail(t){
    phase="done";enable(false);cancelAnimationFrame(raf);var tk=token;
    sfx.ng();lives--;hearts();say(t);
    if(lives<=0){await wait(900,tk);return end(false)}
    if(await wait(1400,tk)){say("もう一度。新しいお手本だ。");if(await wait(700,tk))runStage()}
  }
  function end(win){
    phase="end";
    $("ot").textContent=win?"CLEAR":"GAME OVER";
    $("op").innerHTML=win?"全6ステージ突破。扉が開いた。":"ステージ "+(stage+1)+" で失敗。<br>ライフがなくなった。";
    $("go").textContent=win?"もう一度":"リトライ";
    ov.classList.remove("off");win?sfx.win():sfx.lose();
  }
  $("go").addEventListener("click",function(){
    audio();ov.classList.add("off");stage=0;lives=3;runStage();
  });
  $("snd").addEventListener("click",function(){muted=!muted;this.textContent=muted?"音 OFF":"音 ON";if(!muted)audio()});
  build(4);hearts();
  window.addEventListener("resize",function(){if(!ov.classList.contains("off"))build(4)});
})();
// 扉を開く処理
function openDoor() {
  const doorContainer = document.getElementById('doorContainer');
  doorContainer.classList.add('open');
}
</script>
</body>
</html>
